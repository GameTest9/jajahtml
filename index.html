  keys[e.key.toLowerCase()] = true;
  const keyNum = parseInt(e.key);
  if (gamePaused && player.waitingForChoice) {
    if (player.choiceMode === 'evolution' && keyNum >= 1 && keyNum <= player.availableChoices.length) selectEvolution(keyNum - 1);
    else if (player.choiceMode === 'skill' && keyNum >= 1 && keyNum <= player.availableSkills.length) selectSkill(keyNum - 1);
    else if (player.choiceMode === 'rebirth' && keyNum === 1) performRebirth();
  }
  if (gameOver && e.key.toLowerCase() === 'r') restartGame();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

const camera = {
  x: WORLD_WIDTH / 2, y: WORLD_HEIGHT / 2,
  zoom: 1.0, targetZoom: 1.0,
  update(targetX, targetY, dt) {
    const lerpFactor = 1 - Math.pow(0.001, dt);
    this.x += (targetX - this.x) * lerpFactor;
    this.y += (targetY - this.y) * lerpFactor;
    this.zoom += (this.targetZoom - this.zoom) * lerpFactor;
  },
  setZoom(playerSize) {
    const baseSize = 30;
    const maxZoom = 1.0;
    const minZoom = 0.25;
    const zoomRange = maxZoom - minZoom;
    const sizeRatio = (playerSize - baseSize) / 400;
    this.targetZoom = Math.max(minZoom, maxZoom - sizeRatio * zoomRange);
  },
  worldToScreen(wx, wy) {
    return { x: (wx - this.x) * this.zoom + canvas.width / 2, y: (wy - this.y) * this.zoom + canvas.height / 2 };
  },
  isVisible(wx, wy, margin = 200) {
    const s = this.worldToScreen(wx, wy);
    return s.x > -margin && s.x < canvas.width + margin && s.y > -margin && s.y < canvas.height + margin;
  }
};

function expandWorld(amount) {
  const oldWidth = WORLD_WIDTH;
  const oldHeight = WORLD_HEIGHT;
  WORLD_WIDTH += amount;
  WORLD_HEIGHT += amount;
  const relX = player.wx / oldWidth;
  const relY = player.wy / oldHeight;
  player.wx = relX * WORLD_WIDTH;
  player.wy = relY * WORLD_HEIGHT;
  enemies.forEach(e => {
    const relEx = e.wx / oldWidth;
    const relEy = e.wy / oldHeight;
    e.wx = relEx * WORLD_WIDTH;
    e.wy = relEy * WORLD_HEIGHT;
  });
  camera.x = player.wx;
  camera.y = player.wy;
  addDecorationsForNewArea(oldWidth, oldHeight);
  updateWorldInfo();
}

function addDecorationsForNewArea(oldWidth, oldHeight) {
  const theme = EVOLUTION_TREE[player.currentStageId].theme;
  const newArea = WORLD_WIDTH * WORLD_HEIGHT - oldWidth * oldHeight;
  const oldArea = oldWidth * oldHeight;
  const density = decorations.length / oldArea;
  const newDecorCount = Math.floor(newArea * density);
  for (let i = 0; i < newDecorCount; i++) decorations.push(new Decoration(theme));
}

function updateWorldInfo() {
  worldInfoEl.textContent = `🗺️ マップ: ${WORLD_WIDTH} × ${WORLD_HEIGHT}`;
}

class Particle {
  constructor(wx, wy, color) {
    this.wx = wx; this.wy = wy;
    this.vx = (Math.random() - 0.5) * 250;
    this.vy = (Math.random() - 0.5) * 250;
    this.life = 1.0;
    this.color = color;
    this.size = Math.random() * 6 + 3;
  }
  update(dt) {
    this.wx += this.vx * dt;
    this.wy += this.vy * dt;
    this.life -= dt * 2;
  }
  draw(ctx) {
    const s = camera.worldToScreen(this.wx, this.wy);
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, this.size * camera.zoom, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1.0;
  }
}

  update(dt) { this.wobble += dt * 3; }
  draw(ctx) {
    if (!camera.isVisible(this.wx, this.wy)) return;
    const s = camera.worldToScreen(this.wx, this.wy);
    ctx.font = `${this.size * camera.zoom}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.save();
    ctx.translate(s.x, s.y + Math.sin(this.wobble) * 5 * camera.zoom);
    ctx.fillText(this.emoji, 0, 0);
    ctx.restore();
  }
}

class Decoration {
  constructor(theme) {
    this.wx = Math.random() * WORLD_WIDTH;
    this.wy = Math.random() * WORLD_HEIGHT;
    this.theme = theme;
    this.size = Math.random() * 40 + 30;
    this.alpha = Math.random() * 0.3 + 0.2;
    this.sway = Math.random() * Math.PI * 2;
    if (theme === 'deepsea' || theme === 'sea') this.emoji = Math.random() < 0.5 ? '🫧' : '🪸';
    else if (theme === 'swamp') this.emoji = '🌿';
    else if (theme === 'land') this.emoji = Math.random() < 0.5 ? '🪨' : '🌾';
    else if (theme === 'jungle') this.emoji = Math.random() < 0.5 ? '🌴' : '🌿';
    else if (theme === 'volcano') this.emoji = Math.random() < 0.5 ? '🌋' : '🔥';
    else this.emoji = '🌿';
  }
  update(dt) { this.sway += dt; }
  draw(ctx) {
    if (!camera.isVisible(this.wx, this.wy, 300)) return;
    const s = camera.worldToScreen(this.wx, this.wy);
    ctx.globalAlpha = this.alpha;
    ctx.font = `${this.size * camera.zoom}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(Math.sin(this.sway) * 0.05);
    ctx.fillText(this.emoji, 0, 0);
    ctx.restore();
    ctx.globalAlpha = 1.0;
  }
}

class Player {
  constructor() {
    this.wx = WORLD_WIDTH / 2;
    this.wy = WORLD_HEIGHT / 2;
    this.currentStageId = 'plancton';
    this.exp = 0;
    this.evolutionCount = 0;
    this.rebirthCount = 0;
    this.lastExpansionTier = 0;
    this.waitingForChoice = false;
    this.choiceMode = null;
    this.availableChoices = [];
    this.availableSkills = [];
    this.acquiredSkills = [];
    this.skillLevels = {};
    
    this.speedMultiplier = 1.0;
    this.sizeMultiplier = 1.0;
    this.expMultiplier = 1.0;
    this.magnetRange = 0;
    this.shieldCount = 0;
    this.regenCount = 0;
    this.stealthRange = 1.0;
    this.canDash = false;
    this.dashSpeedMultiplier = 2.5;
    this.dashCooldownReduction = 1.0;
    this.dashCooldown = 0;
    this.dashTimer = 0;
    
    // ✨ 無敵タイマー追加！
    this.invincibleTimer = 0;
    
    this.updateStats();
    camera.x = this.wx;
    camera.y = this.wy;
  }
  updateStats() {
    const stage = EVOLUTION_TREE[this.currentStageId];
    this.emoji = stage.emoji;
    this.baseSize = stage.size;
    this.baseSpeed = stage.speed;
    this.size = stage.size * this.sizeMultiplier;
    this.speed = stage.speed * this.speedMultiplier;
    stageNameEl.textContent = stage.name;
    stageInfoEl.textContent = `進化回数: ${this.evolutionCount}`;
    this.updateRebirthInfo();
    this.updateSkillsDisplay();
    this.updateInvincibleInfo();
    camera.setZoom(this.size);
  }
  updateRebirthInfo() {
    if (this.rebirthCount > 0) {
      const bonus = this.rebirthCount * 10;
      rebirthInfoEl.textContent = `🔄 転生回数: ${this.rebirthCount} (速度+${bonus}%, 経験値+${bonus}%)`;
    } else {
      rebirthInfoEl.textContent = '';
    }
  }
  updateInvincibleInfo() {
    if (this.invincibleTimer > 0) {
      invincibleInfoEl.textContent = `🛡️ 無敵: ${this.invincibleTimer.toFixed(1)}秒`;
    } else {
      invincibleInfoEl.textContent = '';
    }
  }
  updateSkillsDisplay() {
    if (this.acquiredSkills.length === 0) {
      skillsDisplayEl.textContent = '';
      return;
    }
    skillsDisplayEl.innerHTML = '🎯 スキル:<br>' + this.acquiredSkills.map(s => {
      const skill = SKILLS[s];
      const level = this.skillLevels[s] || 1;
      return `${skill.name} Lv.${level}`;
    }).join('<br>');
  }
  update(dt) {
    // 無敵タイマーの更新（gamePaused中でも減算する）
    if (this.invincibleTimer > 0) {
      this.invincibleTimer -= dt;
      if (this.invincibleTimer < 0) this.invincibleTimer = 0;
      this.updateInvincibleInfo();
    }
    
    if (gamePaused || this.waitingForChoice || gameOver) return;
    
    let dx = 0, dy = 0;
    if (keys['arrowup'] || keys['w']) dy -= 1;
    if (keys['arrowdown'] || keys['s']) dy += 1;
    if (keys['arrowleft'] || keys['a']) dx -= 1;
    if (keys['arrowright'] || keys['d']) dx += 1;

    const len = Math.sqrt(dx * dx + dy * dy);
    if (len > 0) { dx /= len; dy /= len; }

    let currentSpeed = this.speed;
    if (this.canDash && keys[' '] && this.dashCooldown <= 0) {
      currentSpeed *= this.dashSpeedMultiplier;
      this.dashTimer = 0.3;
      this.dashCooldown = 2.0 * this.dashCooldownReduction;
    }
    if (this.dashTimer > 0) this.dashTimer -= dt;
    if (this.dashCooldown > 0) this.dashCooldown -= dt;

    this.wx += dx * currentSpeed * dt;
    this.wy += dy * currentSpeed * dt;

    this.wx = Math.max(this.size / 2, Math.min(WORLD_WIDTH - this.size / 2, this.wx));
    this.wy = Math.max(this.size / 2, Math.min(WORLD_HEIGHT - this.size / 2, this.wy));
    
    if (this.magnetRange > 0) {
      foods.forEach(f => {
        const dist = Math.hypot(this.wx - f.wx, this.wy - f.wy);
        if (dist < this.magnetRange && dist > 0) {
          const pull = 300 * (1 - dist / this.magnetRange);
          f.wx += (this.wx - f.wx) / dist * pull * dt;
          f.wy += (this.wy - f.wy) / dist * pull * dt;
        }
      });
    }
  }
  draw(ctx) {
    const s = camera.worldToScreen(this.wx, this.wy);
    
    // 🌈 無敵エフェクト：虹色のオーラ
    if (this.invincibleTimer > 0) {
      const pulse = (Math.sin(performance.now() / 100) + 1) / 2;
      const hue = (performance.now() / 5) % 360;
      ctx.globalAlpha = 0.4 + pulse * 0.3;
      ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, this.size * 0.9 * camera.zoom, 0, Math.PI * 2);
      ctx.fill();
      
      // 外側のグロー
      ctx.globalAlpha = 0.2;
      ctx.strokeStyle = `hsl(${(hue + 180) % 360}, 100%, 70%)`;
      ctx.lineWidth = 6 * camera.zoom;
      ctx.beginPath();
      ctx.arc(s.x, s.y, this.size * 1.1 * camera.zoom, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1.0;
    }
    
    if (this.dashTimer > 0) {
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#ffeb3b';
      ctx.beginPath();
      ctx.arc(s.x, s.y, this.size * 0.8 * camera.zoom, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }
    
    if (this.shieldCount > 0) {
      ctx.strokeStyle = 'rgba(100, 200, 255, 0.8)';
      ctx.lineWidth = 4 * camera.zoom;
      ctx.beginPath();
      ctx.arc(s.x, s.y, this.size * 0.8 * camera.zoom, 0, Math.PI * 2);
      ctx.stroke();
    }
    
    ctx.font = `${this.size * camera.zoom}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.emoji, s.x, s.y);
  }
  addExp(amount) {
    const rebirthBonus = 1 + (this.rebirthCount * 0.1);
    this.exp += amount * this.expMultiplier * rebirthBonus;
    const stage = EVOLUTION_TREE[this.currentStageId];
    
    if (stage.next.length === 0) {
      const ratio = Math.min(this.exp / REBIRTH_EXP_REQUIRED, 1);
      expBarEl.style.width = `${ratio * 100}%`;
      if (this.exp >= REBIRTH_EXP_REQUIRED) this.showRebirthChoice();
    } else {
      const ratio = Math.min(this.exp / stage.expToNext, 1);
      expBarEl.style.width = `${ratio * 100}%`;
      if (this.exp >= stage.expToNext) this.evolve();
    }
  }
  evolve() {
    const stage = EVOLUTION_TREE[this.currentStageId];
    if (stage.isBranchPoint && stage.next.length > 1) {
      this.showEvolutionChoice(stage.next);
    } else {
      this.currentStageId = stage.next[0];
      this.exp = 0;
      this.evolutionCount++;
      this.updateStats();
      showEvolutionMessage(EVOLUTION_TREE[this.currentStageId].name);
      refreshDecorations();
      
      // 🛡️ 進化後3秒間無敵！
      this.invincibleTimer = INVINCIBLE_DURATION;
      this.updateInvincibleInfo();
      
      const currentTier = Math.floor(this.evolutionCount / EVOLUTION_TIER_INTERVAL);
      if (currentTier > this.lastExpansionTier) {
        this.lastExpansionTier = currentTier;
        expandWorld(EXPAND_PER_EVOLUTION_TIER);
      }
      
      this.showSkillChoice();
    }
  }
  showEvolutionChoice(nextIds) {
    this.waitingForChoice = true;
    this.choiceMode = 'evolution';
    this.availableChoices = nextIds;
    gamePaused = true;
    choicesContainerEl.innerHTML = '';
    nextIds.forEach((id, index) => {
      const stage = EVOLUTION_TREE[id];
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="key">${index + 1}</span>${stage.emoji} ${stage.name.replace(stage.emoji + ' ', '')}`;
      btn.onclick = () => selectEvolution(index);
      choicesContainerEl.appendChild(btn);
    });
    evolutionChoiceEl.style.display = 'flex';
  }
  showSkillChoice() {
    this.waitingForChoice = true;
    this.choiceMode = 'skill';
    const shuffled = SKILL_KEYS.sort(() => Math.random() - 0.5);
    this.availableSkills = shuffled.slice(0, 3);
    skillChoicesContainerEl.innerHTML = '';
    this.availableSkills.forEach((skillId, index) => {
      const skill = SKILLS[skillId];
      const currentLevel = this.skillLevels[skillId] || 0;
      const nextLevel = currentLevel + 1;
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      let levelText = currentLevel > 0 ? `<span class="level">Lv.${currentLevel} → Lv.${nextLevel}</span>` : '';
      btn.innerHTML = `<span class="key">${index + 1}</span>${skill.name}${levelText}<span class="desc">${skill.desc}</span>`;
      btn.onclick = () => selectSkill(index);
      skillChoicesContainerEl.appendChild(btn);
    });
    skillChoiceEl.style.display = 'flex';
  }
  showRebirthChoice() {
    this.waitingForChoice = true;
    this.choiceMode = 'rebirth';
    gamePaused = true;
    rebirthChoicesContainerEl.innerHTML = '';
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    const nextRebirth = this.rebirthCount + 1;
    const bonus = nextRebirth * 10;
    btn.innerHTML = `<span class="key">1</span>🔄 転生する<span class="desc">プランクトンから再スタート<br>スキル保持 + 速度/経験値+${bonus}%<br>マップもさらに広がる！</span>`;
    btn.onclick = () => performRebirth();
    rebirthChoicesContainerEl.appendChild(btn);
    rebirthChoiceEl.style.display = 'flex';
  }
  tryEatEnemy(enemy) {
    if (this.evolutionCount > enemy.evolutionCount) return 'eat';
    else if (this.evolutionCount < enemy.evolutionCount) {
      // 🛡️ 無敵状態なら食べられない！
      if (this.invincibleTimer > 0) {
        showEvolutionMessage('🛡️ 無敵で防いだ！');
        return 'blocked';
      }
      if (this.shieldCount > 0) {
        this.shieldCount--;
        this.updateStats();
        showEvolutionMessage('🛡️ 盾で防いだ！');
        return 'blocked';
      }
      if (this.regenCount > 0) {
        this.regenCount--;
        this.updateStats();
        showEvolutionMessage('💚 再生で復活！');
        return 'blocked';
      }
      return 'eaten';
    }
    return 'ignore';
  }
}

class Enemy {
  constructor() {
    this.currentStageId = 'plancton';
    this.evolutionCount = 0;
    this.exp = 0;
    this.wx = Math.random() * WORLD_WIDTH;
    this.wy = Math.random() * WORLD_HEIGHT;
    this.wanderAngle = Math.random() * Math.PI * 2;
    this.wanderTimer = 0;
    this.mode = 'wander';
    this.updateStats();
  }
  updateStats() {
    const stage = EVOLUTION_TREE[this.currentStageId];
    this.emoji = stage.emoji;
    this.size = stage.size;
    this.baseSpeed = stage.speed * 0.85;
    this.expToNext = stage.expToNext;
    this.theme = stage.theme;
  }
  update(dt) {
    const distToPlayer = Math.hypot(this.wx - player.wx, this.wy - player.wy);
    const detectRange = AI_DETECT_RANGE * player.stealthRange;
    let dx = 0, dy = 0;
    let currentSpeed = this.baseSpeed;
    
    if (distToPlayer < detectRange) {
      if (this.evolutionCount < player.evolutionCount) {
        this.mode = 'flee';
        dx = this.wx - player.wx;
        dy = this.wy - player.wy;
        currentSpeed = this.baseSpeed * 1.15;
      } else if (this.evolutionCount > player.evolutionCount) {
        this.mode = 'chase';
        dx = player.wx - this.wx;
        dy = player.wy - this.wy;
        currentSpeed = this.baseSpeed * 0.95;
      } else {
        this.mode = 'wander';
      }
    } else {
      this.mode = 'wander';
    }
    
    if (this.mode === 'wander') {
      let nearestWeakerEnemy = null, nearestWeakerDist = Infinity;
      let nearestStrongerEnemy = null, nearestStrongerDist = Infinity;
      enemies.forEach(other => {
        if (other === this) return;
        const dist = Math.hypot(this.wx - other.wx, this.wy - other.wy);
        if (dist < AI_DETECT_RANGE) {
          if (this.evolutionCount > other.evolutionCount && dist < nearestWeakerDist) {
            nearestWeakerDist = dist; nearestWeakerEnemy = other;
          } else if (this.evolutionCount < other.evolutionCount && dist < nearestStrongerDist) {
            nearestStrongerDist = dist; nearestStrongerEnemy = other;
          }
        }
      });
      if (nearestStrongerEnemy) {
        this.mode = 'flee';
        dx = this.wx - nearestStrongerEnemy.wx;
        dy = this.wy - nearestStrongerEnemy.wy;
        currentSpeed = this.baseSpeed * 1.1;
      } else if (nearestWeakerEnemy) {
        this.mode = 'chase';
        dx = nearestWeakerEnemy.wx - this.wx;
        dy = nearestWeakerEnemy.wy - this.wy;
        currentSpeed = this.baseSpeed * 0.9;
      }
    }
    
    if (this.mode === 'chase' || this.mode === 'flee') {
      const len = Math.hypot(dx, dy);
      if (len > 0) { dx /= len; dy /= len; }
    } else {
      let nearestFood = null, nearestDist = Infinity;
      foods.forEach(f => {
        const dist = Math.hypot(this.wx - f.wx, this.wy - f.wy);
        if (dist < nearestDist) { nearestDist = dist; nearestFood = f; }
      });
      if (nearestFood) {
        dx = nearestFood.wx - this.wx;
        dy = nearestFood.wy - this.wy;
        const len = Math.hypot(dx, dy);
        if (len > 0) { dx /= len; dy /= len; }
      } else {
        this.wanderTimer -= dt;
        if (this.wanderTimer <= 0) {
          this.wanderAngle = Math.random() * Math.PI * 2;
          this.wanderTimer = 2 + Math.random() * 3;
        }
        dx = Math.cos(this.wanderAngle);
        dy = Math.sin(this.wanderAngle);
      }
    }
    
    this.wx += dx * currentSpeed * dt;
    this.wy += dy * currentSpeed * dt;
    this.wx = Math.max(this.size / 2, Math.min(WORLD_WIDTH - this.size / 2, this.wx));
    this.wy = Math.max(this.size / 2, Math.min(WORLD_HEIGHT - this.size / 2, this.wy));
    
    if (this.mode !== 'flee') {
      for (let i = foods.length - 1; i >= 0; i--) {
        const f = foods[i];
        const dist = Math.hypot(this.wx - f.wx, this.wy - f.wy);
        if (dist < (this.size / 2 + f.size / 2) * 0.8) {
          foods.splice(i, 1);
          this.exp += 1;
          if (this.exp >= this.expToNext && EVOLUTION_TREE[this.currentStageId].next.length > 0) this.evolve();
          break;
        }
      }
    }
  }
  evolve() {
    const stage = EVOLUTION_TREE[this.currentStageId];
    if (stage.isBranchPoint) {
      this.currentStageId = stage.next[Math.floor(Math.random() * stage.next.length)];
    } else {
      this.currentStageId = stage.next[0];
    }
    this.exp = 0;
    this.evolutionCount++;
    this.updateStats();
  }
  draw(ctx) {
    if (!camera.isVisible(this.wx, this.wy, 300)) return;
    const s = camera.worldToScreen(this.wx, this.wy);
    let markerColor = '#ffffff';
    if (this.evolutionCount < player.evolutionCount) markerColor = '#4caf50';
    else if (this.evolutionCount > player.evolutionCount) markerColor = '#ff5252';
    ctx.fillStyle = markerColor;
    ctx.beginPath();
    ctx.arc(s.x, s.y - this.size * 0.7 * camera.zoom, 6 * camera.zoom, 0, Math.PI * 2);
    ctx.fill();
    let modeEmoji = '';
    if (this.mode === 'chase') modeEmoji = '🎯';
    else if (this.mode === 'flee') modeEmoji = '💨';
    if (modeEmoji) {
      ctx.font = `${20 * camera.zoom}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(modeEmoji, s.x + this.size * 0.5 * camera.zoom, s.y - this.size * 0.5 * camera.zoom);
    }
    ctx.font = `${this.size * camera.zoom}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.emoji, s.x, s.y);
  }
}

let player;
let foods = [];
let enemies = [];
let decorations = [];
let particles = [];
let lastTime = performance.now();
let evolutionTimer = 0;

function initGame() {
  WORLD_WIDTH = INITIAL_WORLD_SIZE;
  WORLD_HEIGHT = INITIAL_WORLD_SIZE;
  player = new Player();
  foods = [];
  enemies = [];
  decorations = [];
  particles = [];
  gameOver = false;
  gamePaused = false;
  refreshDecorations();
  spawnFoods();
  spawnEnemies();
  updateWorldInfo();
}

function refreshDecorations() {
  decorations = [];
  const theme = EVOLUTION_TREE[player.currentStageId].theme;
  const area = WORLD_WIDTH * WORLD_HEIGHT;
  const density = 150 / (INITIAL_WORLD_SIZE * INITIAL_WORLD_SIZE);
  const count = Math.floor(area * density);
  for (let i = 0; i < count; i++) decorations.push(new Decoration(theme));
}

function spawnFoods() {
  const stage = EVOLUTION_TREE[player.currentStageId];
  const area = WORLD_WIDTH * WORLD_HEIGHT;
  const density = 30 / (INITIAL_WORLD_SIZE * INITIAL_WORLD_SIZE);
  const targetCount = Math.floor(area * density);
  while (foods.length < targetCount) foods.push(new Food(stage));
}

function spawnEnemies() {
  while (enemies.length < MAX_ENEMIES) {
    const enemy = new Enemy();
    let attempts = 0;
    while (Math.hypot(enemy.wx - player.wx, enemy.wy - player.wy) < 800 && attempts < 10) {
      enemy.wx = Math.random() * WORLD_WIDTH;
      enemy.wy = Math.random() * WORLD_HEIGHT;
      attempts++;
    }
    enemies.push(enemy);
  }
}

function selectEvolution(index) {
  const choiceId = player.availableChoices[index];
  player.currentStageId = choiceId;
  player.exp = 0;
  player.evolutionCount++;
  player.waitingForChoice = false;
  player.choiceMode = null;
  player.availableChoices = [];
  player.updateStats();
  evolutionChoiceEl.style.display = 'none';
  showEvolutionMessage(EVOLUTION_TREE[choiceId].name);
  refreshDecorations();
  
  // 🛡️ 進化後3秒間無敵！
  player.invincibleTimer = INVINCIBLE_DURATION;
  player.updateInvincibleInfo();
  
  const currentTier = Math.floor(player.evolutionCount / EVOLUTION_TIER_INTERVAL);
  if (currentTier > player.lastExpansionTier) {
    player.lastExpansionTier = currentTier;
    expandWorld(EXPAND_PER_EVOLUTION_TIER);
  }
  
  player.showSkillChoice();
}

function selectSkill(index) {
  const skillId = player.availableSkills[index];
  const skill = SKILLS[skillId];
  if (!player.acquiredSkills.includes(skillId)) player.acquiredSkills.push(skillId);
  player.skillLevels[skillId] = (player.skillLevels[skillId] || 0) + 1;
  skill.apply(player, player.skillLevels[skillId]);
  player.waitingForChoice = false;
  player.choiceMode = null;
  player.availableSkills = [];
  player.updateStats();
  skillChoiceEl.style.display = 'none';
  gamePaused = false;
  showEvolutionMessage(`${skill.name} Lv.${player.skillLevels[skillId]} 獲得！`);
}

function performRebirth() {
  player.rebirthCount++;
  player.currentStageId = 'plancton';
  player.exp = 0;
  player.evolutionCount = 0;
  player.lastExpansionTier = 0;
  player.waitingForChoice = false;
  player.choiceMode = null;
  
  const rebirthBonus = 1 + (player.rebirthCount * 0.1);
  player.speedMultiplier *= rebirthBonus;
  player.expMultiplier *= rebirthBonus;
  
  expandWorld(EXPAND_PER_REBIRTH);
  
  player.wx = WORLD_WIDTH / 2;
  player.wy = WORLD_HEIGHT / 2;
  
  // 🛡️ 転生後も無敵！
  player.invincibleTimer = INVINCIBLE_DURATION;
  
  player.updateStats();
  rebirthChoiceEl.style.display = 'none';
  gamePaused = false;
  
  showEvolutionMessage(`🔄 転生！ (第${player.rebirthCount}回)`);
  refreshDecorations();
  
  for (let i = 0; i < 30; i++) particles.push(new Particle(player.wx, player.wy, '#ffeb3b'));
}

function showEvolutionMessage(text) {
  evolutionMsgEl.textContent = `✨ ${text} ✨`;
  evolutionMsgEl.style.opacity = '1';
  evolutionMsgEl.style.transform = 'translate(-50%, -50%) scale(1)';
  evolutionTimer = 2.0;
}

function triggerGameOver(eatenBy) {
  gameOver = true;
  gamePaused = true;
  gameoverInfoEl.innerHTML = `進化回数: ${player.evolutionCount}<br>転生回数: ${player.rebirthCount}<br>マップサイズ: ${WORLD_WIDTH} × ${WORLD_HEIGHT}<br>食べられた相手: ${eatenBy.emoji} (進化回数: ${eatenBy.evolutionCount})`;
  gameoverPanelEl.style.display = 'flex';
}

function restartGame() {
  gameoverPanelEl.style.display = 'none';
  initGame();
}
window.restartGame = restartGame;

function checkCollisions() {
  if (gamePaused || gameOver) return;
  
  for (let i = foods.length - 1; i >= 0; i--) {
    const food = foods[i];
    const dist = Math.hypot(player.wx - food.wx, player.wy - food.wy);
    if (dist < (player.size / 2 + food.size / 2) * 0.8) {
      foods.splice(i, 1);
      player.addExp(1);
      for (let j = 0; j < 10; j++) particles.push(new Particle(food.wx, food.wy, '#ffeb3b'));
    }
  }
  
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    const dist = Math.hypot(player.wx - enemy.wx, player.wy - enemy.wy);
    const contactDist = (player.size / 2 + enemy.size / 2) * 0.7;
    if (dist < contactDist) {
      const result = player.tryEatEnemy(enemy);
      if (result === 'eat') {
        for (let j = 0; j < 15; j++) particles.push(new Particle(enemy.wx, enemy.wy, '#ff5252'));
        enemies.splice(i, 1);
        player.addExp(3);
      } else if (result === 'eaten') {
        for (let j = 0; j < 20; j++) particles.push(new Particle(player.wx, player.wy, '#ff0000'));
        triggerGameOver(enemy);
        return;
      }
    }
  }
  
  for (let i = enemies.length - 1; i >= 0; i--) {
    for (let j = enemies.length - 1; j >= 0; j--) {
      if (i === j || !enemies[i] || !enemies[j]) continue;
      const e1 = enemies[i], e2 = enemies[j];
      const dist = Math.hypot(e1.wx - e2.wx, e1.wy - e2.wy);
      const contactDist = (e1.size / 2 + e2.size / 2) * 0.7;
      if (dist < contactDist && e1.evolutionCount > e2.evolutionCount) {
        for (let k = 0; k < 12; k++) particles.push(new Particle(e2.wx, e2.wy, '#ff9800'));
        enemies.splice(j, 1);
        e1.exp += 3;
        if (e1.exp >= e1.expToNext && EVOLUTION_TREE[e1.currentStageId].next.length > 0) e1.evolve();
        break;
      }
    }
  }
}

function drawMinimap() {
  miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
  miniCtx.fillStyle = EVOLUTION_TREE[player.currentStageId].bgColor;
  miniCtx.fillRect(0, 0, miniCanvas.width, miniCanvas.height);
  const px = (player.wx / WORLD_WIDTH) * miniCanvas.width;
  const py = (player.wy / WORLD_HEIGHT) * miniCanvas.height;
  enemies.forEach(e => {
    const ex = (e.wx / WORLD_WIDTH) * miniCanvas.width;
    const ey = (e.wy / WORLD_HEIGHT) * miniCanvas.height;
    if (e.evolutionCount < player.evolutionCount) miniCtx.fillStyle = '#4caf50';
    else if (e.evolutionCount > player.evolutionCount) miniCtx.fillStyle = '#ff5252';
    else miniCtx.fillStyle = '#ffffff';
    miniCtx.fillRect(ex - 2, ey - 2, 4, 4);
  });
  miniCtx.fillStyle = '#ffeb3b';
  miniCtx.beginPath();
  miniCtx.arc(px, py, 4, 0, Math.PI * 2);
  miniCtx.fill();
  miniCtx.fillStyle = 'rgba(255,255,255,0.5)';
  foods.forEach(f => {
    const fx = (f.wx / WORLD_WIDTH) * miniCanvas.width;
    const fy = (f.wy / WORLD_HEIGHT) * miniCanvas.height;
    miniCtx.fillRect(fx - 1, fy - 1, 2, 2);
  });
}

function update(dt) {
  player.update(dt);
  camera.update(player.wx, player.wy, dt);
  if (!gamePaused && !gameOver) {
    enemies.forEach(e => e.update(dt));
    foods.forEach(f => f.update(dt));
    decorations.forEach(d => d.update(dt));
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update(dt);
      if (particles[i].life <= 0) particles.splice(i, 1);
    }
    checkCollisions();
    spawnFoods();
    spawnEnemies();
  }
  if (evolutionTimer > 0) {
    evolutionTimer -= dt;
    if (evolutionTimer <= 0) {
      evolutionMsgEl.style.opacity = '0';
      evolutionMsgEl.style.transform = 'translate(-50%, -50%) scale(0.5)';
    }
  }
}

function draw() {
  const stage = EVOLUTION_TREE[player.currentStageId];
  ctx.fillStyle = stage.bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const topLeft = camera.worldToScreen(0, 0);
  const bottomRight = camera.worldToScreen(WORLD_WIDTH, WORLD_HEIGHT);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 4 * camera.zoom;
  ctx.strokeRect(topLeft.x, topLeft.y, bottomRight.x - topLeft.x, bottomRight.y - topLeft.y);
  decorations.forEach(d => d.draw(ctx));
  foods.forEach(f => f.draw(ctx));
  enemies.forEach(e => e.draw(ctx));
  particles.forEach(p => p.draw(ctx));
  player.draw(ctx);
  drawMinimap();
}

function gameLoop(currentTime) {
  const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
  lastTime = currentTime;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

initGame();
requestAnimationFrame(gameLoop);
</script>
